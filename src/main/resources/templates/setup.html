<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{page.setup.title} + ' - ' + #{app.name}">Setup - AI Git Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body class="bg-body-tertiary">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-end mb-2">
                        <div th:replace="~{fragments/locale-selector :: localeSelector('/setup')}"></div>
                    </div>
                    <div class="text-center mb-4">
                        <img th:src="@{/images/favicon.png}" alt="AI Git Bot logo" width="64" height="64" class="mb-2 brand-icon"/>
                        <h3 class="mt-2" th:text="#{page.setup.heading}">Welcome to AI Git Bot</h3>
                        <p class="text-secondary" th:text="#{page.setup.subtitle}">Create your administrator account</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/setup}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{page.setup.username}">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   th:placeholder="#{page.setup.usernamePlaceholder}" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{page.setup.password}">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:placeholder="#{page.setup.passwordPlaceholder}" required minlength="8"/>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label" th:text="#{page.setup.confirmPassword}">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   th:placeholder="#{page.setup.confirmPasswordPlaceholder}" required minlength="8"/>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-person-plus"></i> <span th:text="#{button.createAdminAccount}">Create Admin Account</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/build-watermark :: buildWatermark}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
